const STORE='cute-diary-wireframe-v3';let day='2026-11-16',view='edit',cursor=null,saveTimer,toastTimer,uploadTarget=null;

function render(){document.body.dataset.mode=view;cursor=null;$('#mode').hidden=view==='history';$('#shareDiary').hidden=view==='history';$('#mode').textContent=view==='edit'?'完成':'编辑';$('#history').innerHTML='<img class="back-door" src="assets/back-door.png" alt="" width="23" height="24">'+(view==='history'?'回到今天':'翻日记');document.querySelectorAll('.scene').forEach(b=>b.classList.toggle('active',b.dataset.scene===(day==='2026-11-13'&&view==='edit'?'empty':view)));
if(view==='history'){const dates=Object.keys(data).filter(k=>data[k].html.replace(/<[^>]*>/g,'').trim()||data[k].html.includes('<img')||data[k].mood||diaryPhotos(k).length).sort().reverse();$('#paper').innerHTML=`<div class="history-head">留下的日子</div>${dates.map(k=>{const text=document.createElement('div');text.innerHTML=data[k].html;return `<button class="history-row" data-day="${k}"><small>${Number(k.slice(5,7))} 月 ${Number(k.slice(8))} 日${data[k].mood?' · '+esc(data[k].mood):''}</small><p>${esc(text.textContent.slice(0,70))||(diaryPhotos(k).length?'贴下了今天的小照片。':'给这一天留了一个小记号。')}</p>${diaryPhotos(k).length?`<img class="history-photo" src="${diaryPhotos(k)[0].src}" alt="日记图片">`:''}</button>`}).join('')}`;return}
const e=entry(),d=new Date(day+'T12:00:00');$('#paper').innerHTML=`<div class="date"><img class="diary-cat" src="assets/note-cat.png" alt="" width="84" height="84" aria-hidden="true"><div><h2>11 月 ${d.getDate()} 日</h2><small>2026 · ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]}</small></div>${view==='edit'?`<button class="mood" id="mood">${ico('smile')}${esc(e.mood)||'心情'}</button>`:`<span class="mood">${e.mood?ico('smile')+esc(e.mood):''}</span>`}</div>${view==='edit'?`<section class="sources" aria-label="今日账单素材"><div class="sources-head"><span>今日账单${dayBills().length?' · '+dayBills().length:''}</span><span>点账单写入 · 点图片选用</span></div><div class="bill-list">${billRows()||'<div class="empty-bills">这天没有账单，也可以直接写。</div>'}</div></section>`:''}<div class="entry" id="entry" ${view==='edit'?'contenteditable="true" role="textbox" aria-label="日记正文" aria-multiline="true"':'role="article" aria-label="日记作品"'} data-placeholder="写一点今天……">${e.html}</div>${view==='read'?'<div class="endmark">· ♡ ·</div>':''}`;
$('#entry').insertAdjacentHTML('afterend','<div class="diary-photos" id="diaryPhotos" aria-label="日记照片"></div>');renderBillPhotoChoices();renderPhotos();
$('#entry').querySelectorAll('.bill-token').forEach(el=>{const b=bills.find(x=>x.id===el.dataset.bill);if(b)el.replaceWith(token(b))});
$('#entry').addEventListener('input',queueSave);$('#entry').addEventListener('paste',e=>{if(view!=='edit')return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));queueSave()});$('#mood')?.addEventListener('click',openMood);$('#paper').scrollTop=0}
document.addEventListener('selectionchange',()=>{const s=window.getSelection(),ed=$('#entry');if(view==='edit'&&s?.rangeCount&&ed?.contains(s.anchorNode)&&ed.contains(s.focusNode))cursor=s.getRangeAt(0).cloneRange()});
function insertNode(node){
const ed=$('#entry');if(!ed||view!=='edit')return;
let r=cursor?.cloneRange();const s=window.getSelection();
if(s?.rangeCount&&ed.contains(s.anchorNode)&&ed.contains(s.focusNode))r=s.getRangeAt(0).cloneRange();
if(!r||!ed.contains(r.commonAncestorContainer)){r=document.createRange();r.selectNodeContents(ed);r.collapse(false)}
ed.focus({preventScroll:true});s.removeAllRanges();s.addRange(r);r.deleteContents();
r.insertNode(node);r.setStartAfter(node);r.collapse(true);
const space=document.createTextNode(' ');r.insertNode(space);r.setStartAfter(space);r.collapse(true);
s.removeAllRanges();s.addRange(r);cursor=r.cloneRange();queueSave();window.DiaryFocus?.scheduleCaret()
}
function insertBill(id){insertNode(token(bills.find(x=>x.id===id)))}
function showSheet(title,body,bind){
settlePhotosForSheet();
document.activeElement?.blur();
const overlay=$('#overlay');
overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="sheet-head"><h3>${esc(title)}</h3><button class="close" aria-label="关闭">×</button></div>${body}</section>`;
overlay.hidden=false;
document.querySelectorAll('.appbar,#paper').forEach(element=>{element.inert=true});
const close=overlay.querySelector('.close');close.onclick=closeSheet;close.focus({preventScroll:true});bind?.()}
function closeSheet(){clearDiaryShare();cancelPhotoEditor();$('#overlay').hidden=true;$('#overlay').innerHTML='';document.querySelectorAll('.appbar,#paper').forEach(element=>{element.inert=false})}
function openReview(id){const b=bills.find(x=>x.id===id);if(!b||view!=='edit')return;
showSheet('给'+b.name+'贴个评价',`<p class="review-caption">这一笔，买得怎么样？</p><div class="review-options">${Object.entries(REVIEWS).map(([key,r])=>`<button class="review-option review-${key}" data-review-value="${key}" data-review-bill="${b.id}" aria-pressed="${b.review===key}"><span class="review-face" aria-hidden="true">${r.face}</span>${r.label}</button>`).join('')}</div>${REVIEWS[b.review]?`<button class="review-clear" data-review-clear="${b.id}">清除评价</button>`:''}`);
$('#overlay').querySelector('.review-option').focus();}
function setReview(id,value){const b=bills.find(x=>x.id===id);if(!b||view!=='edit'||(value&&!REVIEWS[value]))return;const previous=b.review||'';b.review=value;closeSheet();refreshSources();if(save()){notify(value?'贴上了「'+REVIEWS[value].label+'」':'评价已清除')}else{b.review=previous;refreshSources();}document.querySelector('[data-review="'+id+'"]')?.focus();}
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||$('#overlay').hidden)return;const nodes=[...$('#overlay').querySelectorAll('button,textarea,input')].filter(el=>!el.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}});
function openMood(){showSheet('今天的心情',`<div class="options">${[['开心','◡'],['平静','－'],['满足','˘'],['疲惫','⌁'],['低落','︵'],['期待','☆']].map(([s,f])=>`<button class="option ${entry().mood===s?'selected':''}" data-mood="${s}"><span class="face">${f}</span>${s}</button>`).join('')}</div>`)}
function editNote(id){const b=bills.find(x=>x.id===id);showSheet(b.name+'的备注',`<textarea class="note-input" id="noteInput" aria-label="账单备注" placeholder="关于这一笔，记点什么……">${esc(b.note)}</textarea>${b.photo?`<div class="memo-preview"><img src="${b.photo}" alt="账单备注图片"><span class="note-muted">已有备注图片</span></div>`:''}<button class="confirm" id="confirmNote">收好备注</button>`,()=>{$('#confirmNote').onclick=()=>{b.note=$('#noteInput').value.trim();closeSheet();refreshSources();save();notify('备注已收好')}})}
function refreshSources(){if($('.bill-list'))$('.bill-list').innerHTML=billRows();$('#entry')?.querySelectorAll('.bill-token').forEach(el=>{const b=bills.find(x=>x.id===el.dataset.bill);if(b)el.replaceWith(token(b))});renderBillPhotoChoices();renderPhotos();queueSave()}
function billImage(id){const b=bills.find(x=>x.id===id);if(!b.photo){openPhotoMenu(id);return}showSheet(b.name+'的图片',`<div class="memo-preview"><img style="width:100%;height:auto;max-height:230px;object-fit:contain" src="${b.photo}" alt="${esc(b.name)}备注图片"></div><button class="textbutton" id="replaceImage">换一张</button>`,()=>{$('#replaceImage').onclick=()=>openPhotoMenu(id)})}
function switchTo(next,key=day){if(view==='edit'&&!save())return;closeSheet();day=key;view=next;render()}
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-insert]'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){const row=e.target.closest('[data-bill-row]');if(row&&view==='edit')insertBill(row.dataset.billRow);return}const a=b.dataset;if(a.insert)insertBill(a.insert);else if(a.review)openReview(a.review);else if(a.reviewValue)setReview(a.reviewBill,a.reviewValue);else if(a.reviewClear)setReview(a.reviewClear,'');else if(a.note)editNote(a.note);else if(a.image)billImage(a.image);else if(a.mood){entry().mood=a.mood;save();closeSheet();render()}else if(a.scene){if(a.scene==='empty')switchTo('edit','2026-11-13');else switchTo(a.scene,'2026-11-16')}else if(a.day)switchTo('read',a.day)});
$('#shareDiary').onclick=openDiaryShare;$('#mode').onclick=()=>switchTo(view==='edit'?'read':'edit');$('#history').onclick=()=>view==='history'?switchTo('edit','2026-11-16'):switchTo('history');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#fileInput').onchange=handleImageFile;$('#cameraInput').onchange=handleImageFile;
window.addEventListener('pagehide',()=>{if(view==='edit')save()});render();
</script></body></html>
